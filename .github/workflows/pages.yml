name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect public website observations
        env:
          HCI_COLLECTOR_PREVIOUS_URL: https://leejinping8972-svg.github.io/intelligence-system/data/public-site-observations.json
        run: pnpm --filter @vben/web-antd run collect:public

      - name: Build demo
        run: pnpm --filter @vben/web-antd exec vite build --mode demo --base=/intelligence-system/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web-antd/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
