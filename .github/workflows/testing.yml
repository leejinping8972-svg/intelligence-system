name: Test integration source

on:
  push:
    branches: [testing]
  pull_request:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install server dependencies
        run: npm ci --ignore-scripts --prefix server
      - name: Keyword supplement relevance and scoring regressions (synthetic data)
        run: |
          server/node_modules/.bin/esbuild server/model.ts --bundle --platform=node --format=esm --outfile=server/model.js
          pnpm exec vitest run tests/keyword-relevance.test.ts tests/keyword-research.test.ts
      - name: Keyword 30-day, half-year and annual comparisons (synthetic data)
        run: |
          server/node_modules/.bin/esbuild server/collector.ts --bundle --platform=node --format=esm --outfile=server/collector.js
          pnpm exec vitest run tests/trend-comparison.test.ts
          node --test server/trend-queue.test.mjs server/job-progress.test.mjs server/domain.test.mjs workers/site-discovery/test.mjs
      - name: Product and existing collection tests (mocked providers)
        run: |
          node --test server/platform-products.test.mjs server/platform-product-completion.test.mjs server/semrush.test.mjs server/product-queue.test.mjs server/job-progress.test.mjs workers/site-discovery/sorftime.test.mjs server/public-content.test.mjs server/public-article.test.mjs server/public-content-enrichment.test.mjs server/combined-discovery.test.mjs server/market-jobs.test.mjs server/enrichment.test.mjs server/public-content-scope.test.mjs
          pnpm exec vitest run tests/product-decisions.test.ts tests/public-content.test.ts tests/platform-product-selection.test.ts tests/keyword-selection.test.ts tests/article-details.test.ts
      - name: Consumer reports and configurable AI prompts (synthetic data)
        run: |
          node --test server/consumer-reports.test.mjs server/research-insights.test.mjs server/ad-report.test.mjs
          pnpm exec vitest run tests/consumer-reports.test.ts
      - name: Country market research and frozen reports (synthetic data)
        run: node --test server/market-research.test.mjs
      - name: Core list data evidence and nested TikTok fields (synthetic only)
        run: |
          node --test server/product-listing.test.mjs server/semrush-sites.test.mjs server/semrush-sites.integration.test.mjs
          node --test server/core-list-fields.test.mjs
          pnpm exec vitest run tests/core-list-metrics.test.ts
      - name: Product resource routes, budgets, evidence and isolated storage (synthetic only)
        run: |
          node --test server/product-resource-domain.test.mjs server/product-resource-engine.test.mjs server/product-resource-public.test.mjs server/product-resource-sorftime.test.mjs
          pnpm exec vitest run apps/web-antd/src/views/intelligence/__tests__/product-resources.test.ts
          HCI_TEST_PGLITE_MODULE=./server/node_modules/@electric-sql/pglite/dist/index.js node --test server/product-resource.integration.test.mjs
      - name: Persona research budget and evidence boundaries (synthetic data)
        run: |
          node --test server/persona-research.test.mjs server/persona-business-records.test.mjs
          HCI_TEST_PGLITE_MODULE=./server/node_modules/@electric-sql/pglite/dist/index.js node --test server/persona-research.integration.test.mjs
      - name: Frontend type check
        run: pnpm --filter @vben/web-antd run typecheck
      - name: Login and application startup regressions (synthetic accounts)
        run: |
          pnpm exec vitest run tests/public-branding.test.ts tests/application-startup.test.ts tests/component-adapter-startup.test.ts tests/session-startup.test.ts tests/admin-login.test.ts
          node --test server/auth-performance.test.mjs
      - name: Administrator SSO protocol and navigation (synthetic accounts, no external requests)
        run: |
          node --test server/admin-sso.test.mjs server/password-policy.test.mjs
          pnpm exec vitest run tests/admin-sso.test.ts
      - name: Four-source keyword trend windows and daily budgets (synthetic only)
        run: |
          node --test server/keyword-trends.test.mjs
          pnpm exec vitest run tests/four-period-trends.test.ts tests/trend-comparison.test.ts tests/social-trend-format.test.ts
      - name: Focused monitors and advertiser batch selection (synthetic data)
        run: |
          node --test server/advertiser-monitor-batch.test.mjs
          pnpm exec vitest run tests/advertiser-monitor.test.ts tests/competitor-workspace.test.ts
      - name: Site collection fallbacks (synthetic, no paid calls)
        run: node --test server/site-page-fallbacks.test.mjs server/product-queue.test.mjs
      - name: Competitor monitoring and Semrush ranking tests (mocked providers)
        run: node --test server/competitor-monitor.test.mjs server/monitor-public-recovery.test.mjs
      - name: Compact resources, bulk monitoring and Semrush balance (synthetic data)
        run: |
          node --test server/competitor-batch.test.mjs server/semrush-balance.test.mjs server/semrush-usage.test.mjs
          pnpm exec vitest run tests/resource-list.test.ts apps/web-antd/src/views/intelligence/__tests__/compact-tags.test.ts
      - name: Resource timestamps and Chinese keyword names (mocked model)
        run: |
          node --test server/keyword-names.test.mjs
          pnpm exec vitest run tests/resource-metadata.test.ts
      - name: Daily keyword discovery and newness rules (mocked providers)
        run: |
          node --test server/daily-discovery.test.mjs
          pnpm exec vitest run tests/discovery-radar.test.ts
      - name: Task deduplication and delta sync tests (no provider calls)
        run: node --test server/keyword-submit.test.mjs server/workspace-snapshot.test.mjs
      - name: Task list UI tests (synthetic data)
        run: pnpm exec vitest run tests/task-list.test.ts
      - name: Workspace synchronization UI tests (synthetic data)
        run: |
          pnpm exec vitest run tests/cloud-workspace.test.ts tests/workspace-queries.test.ts
          node --test server/workspace-reads.test.mjs
          node --test server/workspace-statistics.test.mjs
          pnpm exec vitest run tests/statistics-queries.test.ts
      - name: Resource market UI tests (synthetic data)
        run: pnpm exec vitest run apps/web-antd/src/views/intelligence/__tests__/resource-market.test.ts
      - name: Build server frontend
        env:
          VITE_HCI_SERVER: 'true'
          VITE_HCI_DEMO: 'false'
          VITE_BASE: /admin/
          VITE_ROUTER_HISTORY: history
          VITE_APP_NAMESPACE: intelligence-testing
        run: pnpm --filter @vben/web-antd exec vite build --mode production --base=/admin/
      - name: Verify frontend layout utilities
        run: node apps/web-antd/scripts/verify-build.mjs apps/web-antd/dist
      - name: Build API image
        run: docker build -t intelligence-platform-products-qa -f server/Dockerfile .
      - name: Isolated MySQL integration (no production network or provider keys)
        run: |
          docker network create --internal platform-products-qa-net
          docker run -d --name platform-products-qa-db --network platform-products-qa-net \
            --memory=512m -e MYSQL_ROOT_PASSWORD=disposable-root-qa-only \
            -e MYSQL_DATABASE=platform_products_qa -e MYSQL_USER=qa \
            -e MYSQL_PASSWORD=disposable-qa-only mysql:8.0 \
            --innodb-buffer-pool-size=64M --performance-schema=OFF --log-bin-trust-function-creators=1
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec platform-products-qa-db mysqladmin ping -h127.0.0.1 -uqa -pdisposable-qa-only --silent; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker run --rm --network platform-products-qa-net --memory=256m \
            -e PLATFORM_PRODUCTS_QA=disposable-only -e QA_MYSQL_HOST=platform-products-qa-db \
            --entrypoint node intelligence-platform-products-qa platform-products.integration.mjs
      - name: Isolated full product completion (synthetic data only)
        run: |
          docker run -d --name product-completion-qa-db --network platform-products-qa-net \
            --memory=512m -e MYSQL_ROOT_PASSWORD=disposable-root-qa-only \
            -e MYSQL_DATABASE=product_completion_qa -e MYSQL_USER=qa \
            -e MYSQL_PASSWORD=disposable-qa-only mysql:8.0 \
            --innodb-buffer-pool-size=64M --performance-schema=OFF --log-bin-trust-function-creators=1
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec product-completion-qa-db mysqladmin ping -h127.0.0.1 -uqa -pdisposable-qa-only --silent; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker run --rm --network platform-products-qa-net --memory=256m \
            -e PRODUCT_COMPLETION_QA=disposable-only -e QA_MYSQL_HOST=product-completion-qa-db \
            --entrypoint node intelligence-platform-products-qa platform-product-completion.integration.mjs
      - name: Isolated competitor monitor integration (synthetic data only)
        run: |
          docker run -d --name competitor-monitor-qa-db --network platform-products-qa-net \
            --memory=512m -e MYSQL_ROOT_PASSWORD=disposable-root-qa-only \
            -e MYSQL_DATABASE=competitor_monitor_qa -e MYSQL_USER=qa \
            -e MYSQL_PASSWORD=disposable-qa-only mysql:8.0 \
            --innodb-buffer-pool-size=64M --performance-schema=OFF --log-bin-trust-function-creators=1
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec competitor-monitor-qa-db mysqladmin ping -h127.0.0.1 -uqa -pdisposable-qa-only --silent; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker run --rm --network platform-products-qa-net --memory=256m \
            -e COMPETITOR_MONITOR_QA=disposable-only -e QA_MYSQL_HOST=competitor-monitor-qa-db \
            --entrypoint node intelligence-platform-products-qa competitor-monitor.integration.mjs
      - name: Isolated administrator SSO and local sessions (synthetic accounts only)
        run: |
          docker run -d --name admin-sso-qa-db --network platform-products-qa-net \
            --memory=512m -e MYSQL_ROOT_PASSWORD=disposable-root-qa-only \
            -e MYSQL_DATABASE=admin_sso_qa -e MYSQL_USER=qa \
            -e MYSQL_PASSWORD=disposable-qa-only mysql:8.0 \
            --innodb-buffer-pool-size=64M --performance-schema=OFF --log-bin-trust-function-creators=1
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec admin-sso-qa-db mysqladmin ping -h127.0.0.1 -uqa -pdisposable-qa-only --silent; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker run --rm --network platform-products-qa-net --memory=256m \
            -e ADMIN_SSO_QA=disposable-only -e QA_MYSQL_HOST=admin-sso-qa-db \
            --entrypoint node intelligence-platform-products-qa admin-sso.integration.mjs
      - name: Isolated workspace snapshots and paged lists (synthetic data only)
        run: |
          docker run -d --name workspace-read-qa-db --network platform-products-qa-net \
            --memory=512m -e MYSQL_ROOT_PASSWORD=disposable-root-qa-only \
            -e MYSQL_DATABASE=workspace_read_qa -e MYSQL_USER=qa \
            -e MYSQL_PASSWORD=disposable-qa-only mysql:8.0 \
            --innodb-buffer-pool-size=64M --performance-schema=OFF --log-bin-trust-function-creators=1
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec workspace-read-qa-db mysqladmin ping -h127.0.0.1 -uqa -pdisposable-qa-only --silent; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          docker run --rm --network platform-products-qa-net --memory=256m \
            -e WORKSPACE_READ_MYSQL_QA=disposable-only -e QA_MYSQL_HOST=workspace-read-qa-db \
            --entrypoint node intelligence-platform-products-qa workspace-reads.integration.mjs
      - name: Clean disposable database
        if: always()
        run: |
          docker rm -f platform-products-qa-db product-completion-qa-db competitor-monitor-qa-db admin-sso-qa-db workspace-read-qa-db || true
          docker network rm platform-products-qa-net || true
      - name: Upload test frontend build
        uses: actions/upload-artifact@v4
        with:
          name: admin-testing-${{ github.sha }}
          path: apps/web-antd/dist
          retention-days: 7
      - name: Build production admin frontend
        env:
          VITE_HCI_SERVER: 'true'
          VITE_HCI_DEMO: 'false'
          VITE_BASE: /admin/
          VITE_ROUTER_HISTORY: history
          VITE_APP_NAMESPACE: intelligence-production
        run: pnpm --filter @vben/web-antd exec vite build --mode production --base=/admin/
      - name: Verify production layout utilities
        run: node apps/web-antd/scripts/verify-build.mjs apps/web-antd/dist
      - name: Upload production frontend build
        uses: actions/upload-artifact@v4
        with:
          name: admin-production-${{ github.sha }}
          path: apps/web-antd/dist
          retention-days: 7
