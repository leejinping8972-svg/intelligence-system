name: intelligence-system

services:
  api:
    build:
      context: ./source
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/intelligence
      SERVER_BRIDGE_KEY: ${SERVER_BRIDGE_KEY:?Set SERVER_BRIDGE_KEY in the server .env}
      PROVIDER_CONFIG_ENCRYPTION_KEY: ${PROVIDER_CONFIG_ENCRYPTION_KEY:?Set PROVIDER_CONFIG_ENCRYPTION_KEY in the server .env}
      DATABASE_CONFIG_FILE: /data/database.enc.json
      ADMIN_SSO_ENABLED: ${ADMIN_SSO_ENABLED:-false}
      ADMIN_SSO_PUBLIC_ORIGIN: ${ADMIN_SSO_PUBLIC_ORIGIN:-https://is.luckdate.com}
      ADMIN_SSO_PEER_ORIGIN: ${ADMIN_SSO_PEER_ORIGIN:-https://ai.chatviva.com}
      ADMIN_SSO_CLIENT_ID: ${ADMIN_SSO_CLIENT_ID:-intelligence-system}
      ADMIN_SSO_PEER_ID: ${ADMIN_SSO_PEER_ID:-chatviva-admin}
      ADMIN_SSO_SHARED_SECRET: ${ADMIN_SSO_SHARED_SECRET:-}
      ADMIN_SSO_ACCOUNT_MAP: ${ADMIN_SSO_ACCOUNT_MAP:-}
    volumes:
      - ./private-config:/data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api',{method:'POST',headers:{'content-type':'application/json','x-server-key':process.env.SERVER_BRIDGE_KEY},body:JSON.stringify({action:'server_status'})}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 192m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intelligence"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    shm_size: 128mb
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the server .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction --requirepass "$$REDISCLI_AUTH"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
