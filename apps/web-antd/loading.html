<style data-app-loading="inject-css">
  .loading {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background: #f4f7f9;
    transition:
      opacity 0.2s,
      visibility 0.2s;
  }
  .loading.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .dark .loading {
    background: #0d0d10;
    color: #fff;
  }
  .loading-brand-mark {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
  }
  .loading-brand-mark img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .loading-brand-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #40897930;
    border-top-color: #408979;
    border-radius: 50%;
    animation: brand-spin 1s linear infinite;
  }
  .loading-brand-title {
    margin: 0;
    color: #262626;
    font:
      600 28px/1.4 system-ui,
      sans-serif;
    text-align: center;
    padding: 0 24px;
  }
  .dark .loading-brand-title {
    color: #fff;
  }
  @keyframes brand-spin {
    to {
      transform: rotate(360deg);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .loading-brand-spinner {
      animation: none;
    }
  }
</style>
<div
  class="loading"
  id="__app-loading__"
  role="status"
  aria-label="正在加载系统"
>
  <div class="loading-brand-mark">
    <div class="loading-brand-spinner" id="loading-brand-spinner"></div>
    <img id="loading-brand-logo" hidden alt="系统 Logo" />
  </div>
  <p class="loading-brand-title" id="loading-brand-title" hidden></p>
</div>
